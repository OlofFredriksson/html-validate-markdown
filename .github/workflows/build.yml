name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: |
          npm run build
          node dist/cjs/index.cjs
          node dist/esm/index.mjs
      - run: npm test
        env:
          CI: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm run prettier:check
      - run: npm run eslint -- --max-warnings 0
      - run: npm run attw

  npm-pkg-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      - name: Install Dependencies
        run: npm ci
      - name: npm-pkg-lint
        uses: ext/npm-pkg-lint@v5.4.0
        with:
          allow-dependencies: "@sidvind/build-scripts"

  html-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        html-validate: [8, 9, 10, 11]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - name: Build
        run: |
          npm ci
          npm run build
          find dist
      - name: Install html-validate v${{ matrix.html-validate }}
        run: |
          if [[ ${{ matrix.html-validate }} -le "9" ]]; then
            npm install jest@29
          fi
          npm install $(npx -y npm-min-peer html-validate --major ${{ matrix.html-validate }} --with-name)
          npm ls html-validate
      - name: Integration test
        run: |
          for spec in test/*.spec.ts; do sed 's#../src/transform#../dist/cjs/index.cjs#g' -i "${spec}"; done
          sed '/dist/s#jest.mock#//#' -i "test/htmlvalidate.spec.ts"
          npm test -- --no-coverage test
        env:
          CI: true
